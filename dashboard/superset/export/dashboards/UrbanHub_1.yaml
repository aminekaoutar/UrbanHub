  MARKDOWN-0-0-0:
    children: []
    id: MARKDOWN-0-0-0
    meta:
      code: "## UrbanHub \xB7 Paris, Lyon, Lille\nPlateforme Big Data Smart City :\
        \ **m\xE9t\xE9o** (NOAA puis Open-Meteo, batch), **v\xE9los en libre-service**\
        \ (CityBikes, streaming toutes les 2 min),\n**qualit\xE9 de l'air** (OpenAQ,\
        \ IoT toutes les 15 min), crois\xE9s heure par heure. Donn\xE9es mises \xE0\
        \ jour automatiquement toutes les heures.\n\n**Mode d'emploi :** la barre\
        \ de **filtres \xE0 gauche** s'applique \xE0 tous les onglets : *P\xE9riode*,\
        \ *Granularit\xE9* (heure, jour, semaine, mois),\n*Ville*, *Type de jour*\
        \ (semaine / week-end) et, dans l'onglet Pollution, *Polluant*. Cliquer sur\
        \ une ville dans un graphique filtre les\nautres graphiques. Survoler une\
        \ courbe affiche les valeurs."
      height: 22
      width: 12
    parents:
    - ROOT_ID
    - TABS-main
    - TAB-0
    - ROW-0-0
    type: MARKDOWN

catalog: urbanhub
schema: public
sql: "SELECT city, date_trunc('day', ((timestamp AT TIME ZONE 'UTC') AT TIME ZONE\
  \ 'Europe/Paris')) AS timestamp,\n       pollutant, avg(value) AS moyenne, max(value)\
  \ AS pic, max(seuil) AS seuil,\n       avg(value) / max(seuil) AS indice, (avg(value)\
  \ > max(seuil))::int AS depassement, count(*) AS nb_hours\nFROM (\nSELECT p.city,\
  \ p.timestamp, v.pollutant, v.value, s.seuil, v.value / s.seuil AS indice,\n   \
  \    \n    to_char(local, 'HH24') || 'h' AS heure,\n    extract(hour FROM local)::int\
  \ AS hour_local,\n    extract(isodow FROM local)::int || ' \xB7 ' ||\n        (ARRAY['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'])[extract(isodow\
  \ FROM local)::int] AS jour,\n    CASE WHEN extract(isodow FROM local) >= 6 THEN\
  \ 'Week-end' ELSE 'Semaine' END AS type_jour,\n    to_char(local, 'MM') || ' \xB7\
  \ ' ||\n        (ARRAY['Janv.','F\xE9vr.','Mars','Avr.','Mai','Juin','Juil.','Ao\xFB\
  t','Sept.','Oct.','Nov.','D\xE9c.'])[extract(month FROM local)::int] AS mois,\n\
  \    CASE WHEN extract(month FROM local) IN (12, 1, 2) THEN '1 \xB7 Hiver'\n   \
  \      WHEN extract(month FROM local) IN (3, 4, 5) THEN '2 \xB7 Printemps'\n   \
  \      WHEN extract(month FROM local) IN (6, 7, 8) THEN '3 \xB7 \xC9t\xE9'\n   \
  \      ELSE '4 \xB7 Automne' END AS saison\nFROM (SELECT *, ((timestamp AT TIME\
  \ ZONE 'UTC') AT TIME ZONE 'Europe/Paris') AS local FROM pollution_city_hourly)\
  \ p\nCROSS JOIN LATERAL (VALUES ('PM2.5', p.pm25), ('PM10', p.pm10), ('NO2', p.no2),\
  \ ('O3', p.o3), ('CO', p.co))\n     AS v(pollutant, value)\nJOIN (VALUES ('PM2.5',\
  \ 15.0), ('PM10', 45.0), ('NO2', 25.0), ('O3', 100.0), ('CO', 4000.0)) AS s(pollutant,\
  \ seuil) USING (pollutant)\nWHERE v.value IS NOT NULL\n) l\nGROUP BY 1, 2, 3"

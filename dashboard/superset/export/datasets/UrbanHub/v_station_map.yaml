sql: "SELECT station_id, station_name, city, latitude, longitude, capacity, usage_per_day,\
  \ occupancy_rate,\n       pct_empty, pct_full, occ_night, occ_day, imbalance,\n\
  \       CASE WHEN imbalance <= -0.15 THEN 'Se vide en journ\xE9e'\n            WHEN\
  \ imbalance >= 0.15 THEN 'Se remplit en journ\xE9e'\n            ELSE '\xC9quilibr\xE9\
  e' END AS profil\nFROM station_profile\nWHERE nb_hours >= 720 AND capacity > 0 AND\
  \ imbalance IS NOT NULL"

table_name: v_urban_hourly
main_dttm_col: timestamp
description: null
default_endpoint: null
offset: 0
cache_timeout: 600
catalog: urbanhub
schema: public
sql: "SELECT city, timestamp, temperature, precipitation, wind_speed, visibility,\n\
  \       usage_events, occupancy_rate, bikes_available, pm25, pm10, no2, o3,\n  \
  \     usage_events::float / NULLIF(nb_bike_stations, 0) AS usage_per_station,\n\
  \       usage_events / NULLIF(avg(usage_events) OVER (PARTITION BY city), 0) AS\
  \ usage_idx,\n       no2 / NULLIF(avg(no2) OVER (PARTITION BY city), 0) AS no2_idx,\n\
  \       pm25 / NULLIF(avg(pm25) OVER (PARTITION BY city), 0) AS pm25_idx,\n    \
  \   \n    to_char(local, 'HH24') || 'h' AS heure,\n    extract(hour FROM local)::int\
  \ AS hour_local,\n    extract(isodow FROM local)::int || ' \xB7 ' ||\n        (ARRAY['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'])[extract(isodow\
  \ FROM local)::int] AS jour,\n    CASE WHEN extract(isodow FROM local) >= 6 THEN\
  \ 'Week-end' ELSE 'Semaine' END AS type_jour,\n    to_char(local, 'MM') || ' \xB7\
  \ ' ||\n        (ARRAY['Janv.','F\xE9vr.','Mars','Avr.','Mai','Juin','Juil.','Ao\xFB\
  t','Sept.','Oct.','Nov.','D\xE9c.'])[extract(month FROM local)::int] AS mois,\n\
  \    CASE WHEN extract(month FROM local) IN (12, 1, 2) THEN '1 \xB7 Hiver'\n   \
  \      WHEN extract(month FROM local) IN (3, 4, 5) THEN '2 \xB7 Printemps'\n   \
  \      WHEN extract(month FROM local) IN (6, 7, 8) THEN '3 \xB7 \xC9t\xE9'\n   \
  \      ELSE '4 \xB7 Automne' END AS saison,\n       CASE WHEN temperature IS NULL\
  \ THEN NULL\n         WHEN temperature < 0 THEN '1 \xB7 < 0 \xB0C'      WHEN temperature\
  \ < 5 THEN '2 \xB7 0-5 \xB0C'\n         WHEN temperature < 10 THEN '3 \xB7 5-10\
  \ \xB0C'    WHEN temperature < 15 THEN '4 \xB7 10-15 \xB0C'\n         WHEN temperature\
  \ < 20 THEN '5 \xB7 15-20 \xB0C'   WHEN temperature < 25 THEN '6 \xB7 20-25 \xB0\
  C'\n         WHEN temperature < 30 THEN '7 \xB7 25-30 \xB0C'   ELSE '8 \xB7 \u2265\
  \ 30 \xB0C' END AS classe_temperature,\n       CASE WHEN precipitation IS NULL THEN\
  \ NULL WHEN precipitation = 0 THEN '0 \xB7 Sec'\n         WHEN precipitation < 1\
  \ THEN '1 \xB7 Faible (< 1 mm/h)' WHEN precipitation < 4 THEN '2 \xB7 Mod\xE9r\xE9\
  e (1-4 mm/h)'\n         ELSE '3 \xB7 Forte (\u2265 4 mm/h)' END AS pluie,\n    \
  \   CASE WHEN wind_speed IS NULL THEN NULL WHEN wind_speed < 2 THEN '1 \xB7 Calme\
  \ (< 2 m/s)'\n         WHEN wind_speed < 4 THEN '2 \xB7 Faible (2-4 m/s)' WHEN wind_speed\
  \ < 6 THEN '3 \xB7 Mod\xE9r\xE9 (4-6 m/s)'\n         WHEN wind_speed < 9 THEN '4\
  \ \xB7 Soutenu (6-9 m/s)' ELSE '5 \xB7 Fort (\u2265 9 m/s)' END AS vent\nFROM (SELECT\
  \ *, ((timestamp AT TIME ZONE 'UTC') AT TIME ZONE 'Europe/Paris') AS local FROM\
  \ urban_city_hourly) u"

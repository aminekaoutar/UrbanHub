catalog: urbanhub
schema: public
sql: "SELECT city,\n       round(latitude::numeric, 2)::float AS lat_zone, round(longitude::numeric,\
  \ 2)::float AS lon_zone,\n       city || ' ' || round(latitude::numeric, 2) || '\
  \ / ' || round(longitude::numeric, 2) AS zone,\n       count(*) AS nb_stations,\
  \ sum(capacity) AS capacity, sum(usage_per_day) AS usage_per_day,\n       sum(usage_per_day)\
  \ / NULLIF(sum(capacity), 0) AS rotation,\n       avg(pct_empty) AS pct_empty, avg(pct_full)\
  \ AS pct_full\nFROM station_profile WHERE nb_hours >= 720 AND capacity > 0\nGROUP\
  \ BY 1, 2, 3, 4"

table_name: v_weather_hourly
main_dttm_col: timestamp
description: null
default_endpoint: null
offset: 0
cache_timeout: 600
catalog: urbanhub
schema: public
sql: "SELECT city, timestamp, temperature, precipitation, wind_speed, wind_direction,\
  \ pressure, visibility, source,\n       \n    to_char(local, 'HH24') || 'h' AS heure,\n\
  \    extract(hour FROM local)::int AS hour_local,\n    extract(isodow FROM local)::int\
  \ || ' \xB7 ' ||\n        (ARRAY['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'])[extract(isodow\
  \ FROM local)::int] AS jour,\n    CASE WHEN extract(isodow FROM local) >= 6 THEN\
  \ 'Week-end' ELSE 'Semaine' END AS type_jour,\n    to_char(local, 'MM') || ' \xB7\
  \ ' ||\n        (ARRAY['Janv.','F\xE9vr.','Mars','Avr.','Mai','Juin','Juil.','Ao\xFB\
  t','Sept.','Oct.','Nov.','D\xE9c.'])[extract(month FROM local)::int] AS mois,\n\
  \    CASE WHEN extract(month FROM local) IN (12, 1, 2) THEN '1 \xB7 Hiver'\n   \
  \      WHEN extract(month FROM local) IN (3, 4, 5) THEN '2 \xB7 Printemps'\n   \
  \      WHEN extract(month FROM local) IN (6, 7, 8) THEN '3 \xB7 \xC9t\xE9'\n   \
  \      ELSE '4 \xB7 Automne' END AS saison,\n       CASE WHEN precipitation IS NULL\
  \ THEN NULL WHEN precipitation = 0 THEN '0 \xB7 Sec'\n         WHEN precipitation\
  \ < 1 THEN '1 \xB7 Faible (< 1 mm/h)' WHEN precipitation < 4 THEN '2 \xB7 Mod\xE9\
  r\xE9e (1-4 mm/h)'\n         ELSE '3 \xB7 Forte (\u2265 4 mm/h)' END AS pluie,\n\
  \       CASE WHEN wind_speed IS NULL THEN NULL WHEN wind_speed < 2 THEN '1 \xB7\
  \ Calme (< 2 m/s)'\n         WHEN wind_speed < 4 THEN '2 \xB7 Faible (2-4 m/s)'\
  \ WHEN wind_speed < 6 THEN '3 \xB7 Mod\xE9r\xE9 (4-6 m/s)'\n         WHEN wind_speed\
  \ < 9 THEN '4 \xB7 Soutenu (6-9 m/s)' ELSE '5 \xB7 Fort (\u2265 9 m/s)' END AS vent\n\
  FROM (SELECT *, ((timestamp AT TIME ZONE 'UTC') AT TIME ZONE 'Europe/Paris') AS\
  \ local FROM weather_city_hourly) w"

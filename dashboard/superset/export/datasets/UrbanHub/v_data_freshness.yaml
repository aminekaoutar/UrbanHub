sql: "SELECT 'M\xE9t\xE9o' AS source, 'weather_city_hourly' AS table_name, city, max(timestamp)\
  \ AS derniere_heure,\n       min(timestamp) AS premiere_heure, count(*) AS nb_lignes\
  \ FROM weather_city_hourly GROUP BY city\nUNION ALL\nSELECT 'V\xE9los', 'mobility_city_hourly',\
  \ city, max(timestamp), min(timestamp), count(*) FROM mobility_city_hourly GROUP\
  \ BY city\nUNION ALL\nSELECT 'Pollution', 'pollution_city_hourly', city, max(timestamp),\
  \ min(timestamp), count(*) FROM pollution_city_hourly GROUP BY city\nUNION ALL\n\
  SELECT 'Crois\xE9', 'urban_city_hourly', city, max(timestamp), min(timestamp), count(*)\
  \ FROM urban_city_hourly GROUP BY city"

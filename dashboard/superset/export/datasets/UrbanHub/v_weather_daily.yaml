table_name: v_weather_daily
main_dttm_col: timestamp
description: null
default_endpoint: null
offset: 0
cache_timeout: 600
catalog: urbanhub
schema: public
sql: "WITH d AS (\n    SELECT city, date_trunc('day', ((timestamp AT TIME ZONE 'UTC')\
  \ AT TIME ZONE 'Europe/Paris')) AS timestamp,\n           avg(temperature) AS tmean,\
  \ min(temperature) AS tmin, max(temperature) AS tmax,\n           sum(precipitation)\
  \ AS precip_mm, avg(wind_speed) AS wind_mean, max(wind_speed) AS wind_max,\n   \
  \        avg(visibility) AS visibility, avg(pressure) AS pressure, max(source) AS\
  \ source,\n           count(temperature) AS nb_hours\n    FROM weather_city_hourly\
  \ GROUP BY 1, 2\n), normale AS (   -- normale du mois sur 2024-2026, par ville\n\
  \    SELECT city, extract(month FROM timestamp) AS m, avg(tmean) AS t_normale, stddev(tmean)\
  \ AS t_sd\n    FROM d GROUP BY 1, 2\n)\nSELECT d.*, n.t_normale, d.tmean - n.t_normale\
  \ AS t_anomalie,\n       (d.tmean - n.t_normale) / NULLIF(n.t_sd, 0) AS z_score,\n\
  \       CASE WHEN (d.tmean - n.t_normale) / NULLIF(n.t_sd, 0) >= 1.5 THEN 'Anormalement\
  \ chaud'\n            WHEN (d.tmean - n.t_normale) / NULLIF(n.t_sd, 0) <= -1.5 THEN\
  \ 'Anormalement froid'\n            ELSE 'Normal' END AS anomalie,\n       CASE\
  \ WHEN extract(isodow FROM d.timestamp) >= 6 THEN 'Week-end' ELSE 'Semaine' END\
  \ AS type_jour\nFROM d JOIN normale n ON n.city = d.city AND n.m = extract(month\
  \ FROM d.timestamp)\nWHERE d.nb_hours >= 12   -- journ\xE9es assez compl\xE8tes\
  \ pour une moyenne fiable"

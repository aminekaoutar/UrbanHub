table_name: v_mobility_hourly
main_dttm_col: timestamp
description: null
default_endpoint: null
offset: 0
cache_timeout: 600
catalog: urbanhub
schema: public
sql: "SELECT city, timestamp, bikes_available, free_slots, capacity, occupancy_rate,\
  \ usage_events,\n       nb_stations, nb_empty_stations, nb_full_stations,\n    \
  \   nb_empty_stations::float / NULLIF(nb_stations, 0) AS pct_empty,\n       nb_full_stations::float\
  \ / NULLIF(nb_stations, 0) AS pct_full,\n       usage_events::float / NULLIF(nb_stations,\
  \ 0) AS usage_per_station,\n       \n    to_char(local, 'HH24') || 'h' AS heure,\n\
  \    extract(hour FROM local)::int AS hour_local,\n    extract(isodow FROM local)::int\
  \ || ' \xB7 ' ||\n        (ARRAY['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'])[extract(isodow\
  \ FROM local)::int] AS jour,\n    CASE WHEN extract(isodow FROM local) >= 6 THEN\
  \ 'Week-end' ELSE 'Semaine' END AS type_jour,\n    to_char(local, 'MM') || ' \xB7\
  \ ' ||\n        (ARRAY['Janv.','F\xE9vr.','Mars','Avr.','Mai','Juin','Juil.','Ao\xFB\
  t','Sept.','Oct.','Nov.','D\xE9c.'])[extract(month FROM local)::int] AS mois,\n\
  \    CASE WHEN extract(month FROM local) IN (12, 1, 2) THEN '1 \xB7 Hiver'\n   \
  \      WHEN extract(month FROM local) IN (3, 4, 5) THEN '2 \xB7 Printemps'\n   \
  \      WHEN extract(month FROM local) IN (6, 7, 8) THEN '3 \xB7 \xC9t\xE9'\n   \
  \      ELSE '4 \xB7 Automne' END AS saison\nFROM (SELECT *, ((timestamp AT TIME\
  \ ZONE 'UTC') AT TIME ZONE 'Europe/Paris') AS local FROM mobility_city_hourly) m"
